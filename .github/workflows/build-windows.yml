name: Build Windows Installer

on:
    push:
        branches: [main, "1.0.2-perTest"]
        tags: ["v*"]
    pull_request:
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build-windows:
        runs-on: windows-latest

        env:
            WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
            WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}

        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Install Qt
              uses: jurplel/install-qt-action@v4
              with:
                  version: "6.8.3"
                  target: desktop
                  arch: win64_msvc2022_64
                  cache: true

            - name: Extract Ultralight SDK
              shell: pwsh
              run: |
                  $target = "sdk/ultralight-free-sdk-1.4.0-win-x64"
                  Remove-Item $target -Recurse -Force -ErrorAction SilentlyContinue
                  New-Item $target -ItemType Directory -Force | Out-Null
                  7z x "sdk/ultralight-free-sdk-1.4.0-win-x64.7z" "-o$target" -y
                  @(
                    "$target/include/AppCore/App.h",
                    "$target/bin/Ultralight.dll",
                    "$target/resources/icudt67l.dat",
                    "$target/license/EULA.txt"
                  ) | ForEach-Object {
                    if (-not (Test-Path $_)) { throw "Incomplete Ultralight SDK: missing $_" }
                  }

            - name: Configure
              shell: pwsh
              run: >
                  cmake -S . -B build-windows
                  -DCMAKE_BUILD_TYPE=Release
                  -DCMAKE_INSTALL_PREFIX="$PWD/stage"
                  -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

            - name: Build
              shell: pwsh
              run: cmake --build build-windows --config Release --parallel

            - name: Stage application
              shell: pwsh
              run: |
                  cmake --install build-windows --config Release --prefix "$PWD/stage"
                  @(
                    "stage/bin/ultralightwebcursor-gui.exe",
                    "stage/bin/ultralightwebcursor-engine.exe",
                    "stage/bin/Ultralight.dll",
                    "stage/bin/resources/icudt67l.dat"
                  ) | ForEach-Object {
                    if (-not (Test-Path $_)) { throw "Staging failed: missing $_" }
                  }

            - name: Deploy Qt runtime
              shell: pwsh
              run: |
                  windeployqt --release --qmldir GUI "stage/bin/ultralightwebcursor-gui.exe"
                  windeployqt --release "stage/bin/ultralightwebcursor-engine.exe"

            - name: Build installer
              shell: pwsh
              run: |
                  $makensis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
                  $candidate = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
                  if (-not $makensis) { $makensis = $candidate }
                  if (-not (Test-Path $makensis)) {
                    choco install nsis -y --no-progress
                    $makensis = $candidate
                  }
                  if (-not (Test-Path $makensis)) { throw "makensis not found" }
                  $version = (Get-Content "build-windows/uwc-version.txt").Trim()
                  & $makensis /DSTAGE_DIR="$PWD\stage" /DAPP_VERSION="$version" /DAPP_ICON="$PWD\GUI\icons\UltralightWebCursor.ico" /DOUT_FILE="$PWD\ultralightwebcursor-windows-x64-setup.exe" "packaging\windows\installer.nsi"

            - name: Sign installer
              if: ${{ env.WINDOWS_PFX_BASE64 != '' }}
              shell: pwsh
              run: |
                  $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
                  [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
                  $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
                    Sort-Object FullName -Descending | Select-Object -First 1).FullName
                  if (-not $signtool) { throw "signtool.exe not found" }
                  & $signtool sign /fd SHA256 /f $pfx /p $env:WINDOWS_PFX_PASSWORD /tr http://timestamp.digicert.com /td SHA256 "ultralightwebcursor-windows-x64-setup.exe"

            - name: Create checksum
              shell: pwsh
              run: |
                  $hash = (Get-FileHash "ultralightwebcursor-windows-x64-setup.exe" -Algorithm SHA256).Hash.ToLower()
                  "$hash  ultralightwebcursor-windows-x64-setup.exe" | Set-Content -Encoding ascii "ultralightwebcursor-windows-x64-setup.exe.sha256"

            - name: Upload installer
              uses: actions/upload-artifact@v4
              with:
                  name: ultralightwebcursor-windows-x64-setup
                  path: |
                      ultralightwebcursor-windows-x64-setup.exe
                      ultralightwebcursor-windows-x64-setup.exe.sha256
                  if-no-files-found: error

            - name: Publish release
              if: startsWith(github.ref, 'refs/tags/')
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      ultralightwebcursor-windows-x64-setup.exe
                      ultralightwebcursor-windows-x64-setup.exe.sha256
                  generate_release_notes: true
